      description: >-
        Retrieves a supplier associated with the authenticated business by their
        DigiTax supplier ID.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: supplier_id
          required: true
          schema:
            type: string
            description: Supplier ID on DigiTax
            example: supplier_01JS16JDB2B5ESZ8HWJ3CBYP5Y
      responses:
        '200':
          description: Success
          content:
            application/json:
