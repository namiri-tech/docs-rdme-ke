        date:
          type: string
          description: The receipt date (DD/MM/YYYY), as printed on the physical receipt
          example: 14/07/2026
        time:
          type: string
          description: The time shown on the receipt.
          example: 04:16:11 pm
        trader_invoice_number:
          type: string
          description: >-
            The invoice reference from your system. It must be unique across
            sales and credit notes in the business. References from failed
            transactions can be reused.
          example: '12345678901'
        receipt_type_code:
          type: string
          description: >-
            The code identifying the receipt type, such as S for an invoice or R
            for a credit note.
          example: S
        credit_note_reason:
          type: string
          description: >-
            The reason code for the credit note. Values are `01` (Missing
            Quantity), `02` (Missing Data), `03` (Damaged), `04` (Wasted), `05`
            (Material Shortage), and `06` (Refund).
          example: '06'
        sale_detail_url:
          type: string
          description: The URL for accessing the sale details.
          example: https://api.digitax.tech/sales/YKSWCIiuvx
          format: url
        serial_number:
          type: string
          description: The receipt serial number issued by KRA.
          example: KRACU0400000001
        receipt_number:
          type: integer
          description: The receipt number associated with the sale.
          example: 38
        invoice_number:
          type: integer
          description: The invoice number associated with the sale.
          example: 38
