          properties:
            name:
              type: string
              description: The name of the customer.
              example: John Doe
            pin:
              type: string
              description: The KRA PIN of the customer.
              example: P012345678P
            email:
              type: string
              description: The customer's email address.
              example: support@namiri.tech
            phone:
              type: string
              description: The customer's phone number.
              example: 254712345678
        items:
          type: array
          description: The list of items included in the sale.
          items:
            type: object
            required:
              - id
              - name
              - price
              - currency
              - quantity
            properties:
              id:
                type: string
                description: The DigiTax ID of the sale line, not the catalogue item ID.
                example: saleitem_01HC3J1VVVM05YCTS61G7V3KC6
              name:
                type: string
                description: The name of the item.
                example: DigiTax Product 01
              price:
                type: integer
                description: The price of the item.
                example: 600
              currency:
                type: string
                description: The currency used for the item price.
                example: KES
              quantity:
                type: integer
                description: The quantity of the item sold.
                example: 1
        logo_url:
          type: string
          description: The URL of the business logo.
    InvoiceVerification:
      type: object
      required:
        - status
        - created_at
        - source
      properties:
        status:
          type: string
          description: The status of the invoice verification.
          example: success
        created_at:
          type: string
          description: The date-time when the verification record was created (ISO 8601)
          example: '2026-07-14T15:09:02.036Z'
        data:
          type: object
          description: The details returned for the invoice verification.
          $ref: '#/components/schemas/VerificationDetail'
        source:
          type: string
          enum:
            - EXTERNAL
            - INTERNAL
          description: >-
            Source of the verification. Possible values are EXTERNAL and
            INTERNAL. EXTERNAL means the invoice is being verified for the first
            time; so the data was verified against KRA eTIMS. The source for
            subsequent verifications of the same invoice will be INTERNAL; since
            data from the first attempt is saved and used for subsequent
            validations.
          example: EXTERNAL
    VerificationDetail:
      type: object
      required:
        - invoice_timestamp
        - invoice_number
        - number_of_items
        - verification_date
      properties:
        invoice_timestamp:
          type: string
          description: Invoice timestamp (ISO 8601)
          example: '2026-07-14T10:23:06Z'
        number_of_items:
          type: integer
          description: The number of items in the invoice.
          example: 2
        invoice_number:
          type: string
          description: The invoice number being verified.
          example: KRACU0300000024/39
        verification_date:
          type: string
          description: >-
            Date invoice was verified for the first time against KRA eTIMS (ISO
            8601)
          example: '2026-07-14T15:09:02.036Z'
    Supplier:
      type: object
      required:
        - id
        - supplier_tin
        - supplier_name
        - taxpayer_type
      properties:
        id:
          type: string
          description: The DigiTax ID of the supplier.
          example: supplier_01JS16JDB2B5ESZ8HWJ3CBYP5Y
        supplier_name:
          type: string
          description: The name of the supplier.
          example: John Doe Inc
        email:
          type: string
          description: The supplier's email address.
          example: accounts@johndoeinc.com
        phone:
          type: string
          description: The supplier's phone number.
          example: '+254712345678'
        supplier_tin:
          type: string
          description: The supplier's Tax Identification Number (TIN).
          example: P012345678P
        taxpayer_type:
          type: string
          enum:
            - INDIVIDUAL
            - BUSINESS
          description: >-
            The type of taxpayer, derived from the TIN prefix - P is BUSINESS,
            all other prefixes are INDIVIDUAL.
          example: INDIVIDUAL
        invoicing:
          type: object
          description: Reverse-invoicing settings associated with the supplier.
          required:
            - reverse_invoice_type
            - reverse_invoice_authorisation
          properties:
            reverse_invoice_type:
              type: string
              enum:
                - REGULAR
                - THIRD_PARTY
              description: >-
                Identifies the customer on the reverse invoice issued on behalf
                of the supplier. REGULAR uses the authenticated business as the
                customer; THIRD_PARTY uses the supplied customer details.
              example: REGULAR
            reverse_invoice_authorisation:
              type: string
              enum:
                - IMPLICIT
                - EXPLICIT
              description: >-
                Whether the supplier is deemed to have authorised the reverse
                invoice automatically (IMPLICIT) or must explicitly approve it
                (EXPLICIT). Determined by the business's reverse invoicing
                configuration with KRA.
              example: IMPLICIT
        status:
          type: string
          enum:
            - PENDING
            - FAILED
            - COMPLETED
          description: >-
            Whether the supplier has been synced with KRA's eTIMS - PENDING
            until synced, then COMPLETED or FAILED.
    Summary:
      type: object
      required:
        - total_sales_count
        - total_sales_amount
      properties:
        total_sales_count:
          type: integer
          description: The total number of sales.
          example: 22
        total_sales_amount:
          type: number
          description: The total amount of sales.
          format: float
          example: 456701.95
    SalesSummary:
      type: object
      required:
        - summary
      properties:
        summary:
          type: object
          description: >-
            Sales summaries for the requested date range, keyed by
            synchronization status (PENDING, DRAFT, FAILED, COMPLETED, or
            SUBMITTED).
          additionalProperties:
            $ref: '#/components/schemas/Summary'
  parameters:
    After:
      in: query
      name: after
      required: false
      schema:
        type: string
        description: >-
          When paginating results, a pointer to an ID after which we want
          results.
        example: <entity>_01HC3J1VVVM05YCTS61G7V3KC6
    Before:
      in: query
      name: before
      required: false
      schema:
        type: string
        description: >-
          When paginating results, a pointer to an ID before which we want
          results.
        example: <entity>_01HC3J1VVVM05YCTS61G7V3KC6
    PageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        maximum: 20
        minimum: 1
        description: The maximum number of items to return per page, defaults to 20.
        example: 20
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
tags: []
