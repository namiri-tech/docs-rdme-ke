        content:
          application/json:
            schema:
              type: object
              required:
                - supplier_name
                - supplier_tin
              properties:
                supplier_name:
                  type: string
                  description: Supplier name. Required for reverse invoicing.
                  example: John Doe Inc.
                supplier_tin:
                  type: string
                  description: >-
                    Supplier Tax Identification Number (TIN) - an 11-character
                    KRA PIN consisting of a leading A or P, 9 digits, and a
                    trailing letter.
                  example: P012345678P
                email:
                  type: string
                  description: Supplier's email address.
                  example: accounts@johndoeinc.com
                phone:
                  type: string
                  description: >-
                    Supplier's phone number. Required when onboarding a reverse
                    invoicing supplier unless the business has been configured
                    to allow it to be omitted.
                  example: '+254712345678'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers/{supplier_id}:
    get:
      tags:
