  /stock/transfer:
    post:
      tags:
        - Stock
      summary: Transfer stock between businesses.
      description: >-
        Transfers a specified quantity of stock from an item in the
        authenticated business to an item in the receiving business.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_id
                - business_id
                - quantity
                - receiving_item_id
              properties:
                item_id:
                  type: string
                  description: >-
                    The DigiTax ID of the item from which stock will be
                    deducted.
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
                business_id:
                  type: string
                  description: >-
                    The DigiTax ID of the business receiving the transferred
                    stock.
                  example: business_01HC3J1VVVM05YCTS61G7V3KC6
                quantity:
                  type: number
                  description: The quantity of stock to transfer.
                  example: 1
                receiving_item_id:
                  type: string
                  description: The DigiTax ID of the item receiving the transferred stock.
                  example: item_01J8HJFH3NG17EGVF0N5GHMPM9
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stock/adjust:
    put:
      tags:
        - Stock
      summary: Adjust item stock.
      description: >-
        Adjusts an item's stock quantity using the specified quantity,
        adjustment action, and stock movement type.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_id
                - quantity
                - action
                - movement_type
              properties:
                item_id:
                  type: string
                  description: The DigiTax ID of the item whose stock is being adjusted.
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
                quantity:
                  type: number
                  description: The quantity of stock to add or deduct.
                  example: 100
                action:
                  type: string
                  enum:
                    - ADD
                    - DEDUCT
                  description: The stock adjustment action.
                  example: ADD
                movement_type:
                  type: string
                  description: The code identifying the stock movement type.
                  example: '01'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - item_code
                  - stock_quantity
                properties:
                  id:
                    type: string
                    description: The DigiTax ID of the item.
                    example: item_01HC3J1VVVM05YCTS61G7V3KC6
                  item_code:
                    type: string
                    description: >-
                      The item code generated by DigiTax from the country of
                      origin, item type, packaging unit, quantity unit, and an
                      eight-digit sequence number.
                    example: KE1PD-U230411121122
                  stock_quantity:
                    type: integer
                    description: The item's stock quantity after the adjustment.
                    example: 300
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
