components:
  schemas:
    Success:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: A message confirming that the operation succeeded.
    Error:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
          description: A human-readable explanation of the error.
        code:
          type: string
          description: The error code returned by the API.
        metadata:
          type: object
          description: Additional structured details about the error, when available.
          additionalProperties:
            type: string
    FetchMeta:
      type: object
      description: Metadata about when data was last fetched from eTIMS.
      required:
        - last_updated
      properties:
        last_updated:
          type: string
          example: '2026-07-14T21:00:00.000Z'
          description: Timestamp when the data was last updated from eTIMS
    Notice:
      type: object
      required:
        - id
        - notice_number
        - notice_date
        - title
        - detail
        - by
        - link
      properties:
        id:
          type: string
          example: notice_01HC3J1VVVM05YCTS61G7V3KC6
          description: The DigiTax ID for the notice.
        notice_number:
          type: string
          example: 01HC3J1VVVM05YCTS61G7V3KC6
          description: Notice number from eTIMS
        notice_date:
          type: string
          description: Notice date-time in ISO 8601 format
          example: '2026-07-14T21:00:00.000Z'
        title:
          type: string
          description: The title of the KRA notice.
          example: Call to Action
        detail:
          type: string
          description: The details of the KRA notice.
          example: Call to Action
        by:
          type: string
          description: The organization issuing the notice.
          example: KENYA REVENUE AUTHORITY
        link:
          type: string
          description: The URL associated with the notice.
          example: https://etims.kra.go.ke
    Branch:
      type: object
      required:
        - tax_pin
        - branch_office_id
        - branch_office_name
        - branch_status_code
        - county_name
        - sub_county_name
        - tax_locality_name
        - location_description
        - manager_name
        - manager_contact
        - manager_email
        - business_id
      properties:
        id:
          type: string
          description: The DigiTax ID of the branch.
          example: branch_01HC3J1VVVM05YCTS61G7V3KC6
        tax_pin:
          type: string
          description: Branch KRA PIN
          example: P012345678P
        branch_office_id:
          type: string
          description: Branch Office ID
          example: 0
        branch_office_name:
          type: string
          description: Branch Office Name
          example: Head Office
        branch_status_code:
          type: string
          description: Branch Status Code
          example: 1
        county_name:
          type: string
          description: County Name
          example: Nairobi
        sub_county_name:
          type: string
          description: Sub County Name
          example: Westlands
        tax_locality_name:
          type: string
          description: Tax Locality Name
          example: CBD
        location_description:
          type: string
          description: Location Description
          example: 1st Floor
        manager_name:
          type: string
          description: Manager Name
          example: John Doe
        manager_contact:
          type: string
          description: Manager Contact
          example: 712345678
        manager_email:
          type: string
          description: Manager Email
          example: manager@email.com
        is_head_office:
          type: boolean
          description: Is Head Office
          example: true
        business_id:
          type: string
          description: The DigiTax ID of the business.
          example: business_01JPAF3FHV3M85T2KVEDQQGFGJ
    Customer:
      type: object
      required:
        - id
        - customer_tin
        - customer_name
        - taxpayer_type
      properties:
        id:
          type: string
          description: The DigiTax ID of the customer.
          example: customer_01HC3HTDAXQ50E07CWR2A2CFBD
        customer_name:
          type: string
          description: The customer's name.
          example: John Doe
        email:
          type: string
          description: The customer's email address.
          example: john@doe.com
        phone:
          type: string
          description: The customer's phone number.
          example: 254712345678
        customer_tin:
          type: string
          description: The customer's Tax Identification Number (TIN).
          example: P012345678P
        taxpayer_type:
          type: string
          enum:
            - INDIVIDUAL
            - BUSINESS
          description: >-
            The taxpayer type, derived from the TIN prefix - P is BUSINESS, all
            other prefixes are INDIVIDUAL.
          example: INDIVIDUAL
    Insurance:
      type: object
      required:
        - id
        - insurance_name
        - insurance_code
        - premium_rate
      properties:
        id:
          type: string
