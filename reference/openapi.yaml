          description: The name of the customer associated with the sale.
          example: John Doe
        customer_tin:
          type: string
          description: The tax identification number of the customer.
          example: P123456789P
        customer_phone_number:
          type: string
          description: The customer's phone number.
          example: '+254112685368'
        customer_email:
          type: string
          description: The customer's email address.
          example: info@namiri.tech
        internal_data:
          type: string
          description: The internal data returned for the sale.
          example: PB3ZSZP3RZR3AUPYBYLUTFJDIA
        receipt_signature:
          type: string
          description: The signature associated with the receipt.
          example: 3JYZVPTPMYBGHG4A
        etims_url:
          type: string
          description: The URL for viewing the receipt in the eTIMS.
          example: >-
            https://etims.kra.go.ke/common/link/etims/receipt/indexEtimsReceptData?{P053100692D+00+3JYZVPTPMYBGHG4A}
          format: url
