openapi: 3.0.1
info:
  title: DigiTax Kenya API Endpoints
  description: DigiTax Kenya Public API
  version: '3'
  termsOfService: https://digitax.tech/page/terms
  contact:
    name: DigiTax
    url: https://digitax.tech
    email: support@namiri.tech
  license:
    name: Apache 2.0
servers:
  - url: https://api.digitax.tech/ke/v2
    description: API
paths:
  /etims-info:
    get:
      summary: Get eTIMS information on the business
      description: >-
        Retrieves the business information associated with the authenticated API
        key.
      tags:
        - Businesses
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /branches:
    get:
      summary: Get a list of business branches
      description: >-
        Retrieves the list of business branches associated with the
        authenticated API key.
      tags:
        - Businesses
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    description: The list of business branches.
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items:
    post:
      tags:
        - Items
      summary: Create an item
      description: Create an item
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_class_code
                - item_type_code
                - item_name
                - origin_nation_code
                - package_unit_code
                - quantity_unit_code
                - tax_type_code
                - default_unit_price
              properties:
                item_class_code:
                  type: string
                  description: >-
                    The item class code of the item. <br>Refer to the [DigiTax
                    Kenya eTIMS Item Classification Code
                    list](https://ke.docs.digitax.tech/docs/items-item-classification-table)
                    for more information.
                  example: '99020000'
                item_type_code:
                  type: string
                  description: >-
                    The item type code of the item. <br>Refer to the [DigiTax
                    Kenya eTIMS Item Type code
                    list](https://ke.docs.digitax.tech/docs/item-attributes-items#item-type-codes)
                    for more information.
                  example: '3'
                item_name:
                  type: string
                  description: The name of the item.
                  example: DigiTax Product 01
                origin_nation_code:
                  type: string
                  description: >-
                    The country of origin code of the item. <br>Refer to the
                    [DigiTax Kenya eTIMS Country Codes
                    list](https://ke.docs.digitax.tech/docs/item-attributes-items#country-codes)
                    for more information.
                  example: KE
                package_unit_code:
                  type: string
                  description: >-
                    The package unit code of the item. <br>Refer to the [DigiTax
                    Kenya eTIMS Package Unit Codes
                    list](https://ke.docs.digitax.tech/docs/item-attributes-items#package-unit-codes)
                    for more information.
                  example: NT
                quantity_unit_code:
                  type: string
                  description: >-
                    The quantity unit code of the item. <br>Refer to the
                    [DigiTax Kenya eTIMS Quantity Unit Codes
                    list](https://ke.docs.digitax.tech/docs/item-attributes-items#quantity-unit-codes)
                    for more information.
                  example: U
                tax_type_code:
                  type: string
                  description: >-
                    The tax type code of the item. <br>Refer to the [DigiTax
                    Kenya eTIMS Tax Type Codes
                    list](https://ke.docs.digitax.tech/docs/item-attributes-items#taxation-type-codes)
                    for more information.
                  example: D
                default_unit_price:
                  type: number
                  description: The default unit price of the item.
                  example: 1000
                stock_quantity:
                  type: number
                  description: The starting stock quantity of the item.
                  example: 100
                callback_url:
                  type: string
                  description: >-
                    Optional URL where DigiTax sends an HTTP POST callback with
                    event `item.sync` when the item is successfully synced to
                    eTIMS. See [Callback
                    URLs](https://ke.docs.digitax.tech/docs/callback-urls) for
                    the payload.
                  example: https://example.site/services/digitaxQueueReceiverPROXY
                item_bar_code:
                  type: string
                  description: >-
                    The bar code of the item. <br>EAN-13 barcodes are
                    recommended, but not required. <br>**Ideally set your
                    internal item ID here**. It comes in handy during
                    reconciliation when you are comparing data reports between
                    DigiTax and your system.
                  example: '7994391127606'
                levies:
                  type: array
                  description: >-
                    The levy codes to apply to the item, e.g. `CTL` for the 2%
                    Catering Levy. Unrecognised codes are rejected.
                  items:
                    type: string
                    description: A levy code applied to the item.
                    example: CTL
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Items
      summary: Get list of items owned by the business
      description: >-
        Retrieves a paginated list of items belonging to the authenticated
        business.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    description: The list of items belonging to the business.
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{item_id}:
    parameters:
      - in: path
        name: item_id
        required: true
        description: The DigiTax ID of the item.
        schema:
          type: string
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
    put:
      tags:
        - Items
      summary: Update an item
      description: >-
        Updates the supported fields of an existing item identified by its
        DigiTax ID.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_name:
                  type: string
                  description: The name of an item. Leave unset to keep the current name.
                  example: DigiTax Product 02
                tax_type_code:
                  type: string
                  description: The tax type code of the item.
                default_unit_price:
                  type: number
                  description: The default unit price of the item.
                  example: 1000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Items
      summary: Get a specific item
      description: Retrieves the details of an item identified by its DigiTax item ID.
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers:
    get:
      tags:
        - Customers
      summary: Get a list of business customers
      description: >-
        Retrieves a paginated list of customers associated with the
        authenticated business.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    description: The list of customers associated with the business.
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Customers
      summary: Save business customer
      description: >-
        Creates a customer record for the authenticated business using the
        supplied customer details.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_name
                - customer_tin
              properties:
                customer_name:
                  type: string
                  description: The name of the customer.
                  example: John Doe
                customer_tin:
                  type: string
                  description: >-
                    The customer's Tax Identification Number (TIN) - an
                    11-character KRA PIN consisting of a leading A or P, 9
                    digits, and a trailing letter.
                  example: P012345678P
                email:
                  type: string
                  description: The customer's email address.
                  example: john@doe.com
                phone:
                  type: string
                  description: The customer's phone number.
                  example: 254712345678
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customer_id}:
    get:
      tags:
        - Customers
      summary: Get a business customer
      description: Retrieves information about a customer given their ID on DigiTax
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: customer_id
          required: true
          description: The DigiTax ID of the customer to retrieve.
          schema:
            type: string
            description: Customer ID on DigiTax
            example: customer_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Customers
      summary: Update a business customer
      description: >-
        Updates an existing customer record identified by its DigiTax customer
        ID.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: customer_id
          required: true
          description: The DigiTax ID of the customer to update.
          schema:
            type: string
            description: Customer ID on DigiTax
            example: customer_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_name
              properties:
                customer_name:
                  type: string
                  description: >-
                    The customer's name. This field is required; send an empty
                    string to keep the current name.
                  example: John Doe
                email:
                  type: string
                  description: >-
                    The customer's email address. Leave unset to keep the
                    current email address.
                  example: john@doe.com
                phone:
                  type: string
                  description: >-
                    The customer's phone number. Leave unset to keep the current
                    phone number.
                  example: 254712345678
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports:
    get:
      tags:
        - Imports
      summary: Get list of import items received from eTIMS
      description: Retrieves a paginated list of imported items from eTIMS.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - meta
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/FetchMeta'
                  data:
                    description: The list of imported items retrieved from eTIMS.
                    type: array
                    items:
                      $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{import_id}/link:
    put:
      tags:
        - Imports
      summary: Link import item to an item in DigiTax
      description: >-
        Links an imported item to an existing DigiTax item and adds the imported
        quantity to that item's stock balance. If the import is already linked,
        its stock is not added again.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: import_id
          required: true
          description: The DigiTax ID of the import item to link.
          schema:
            type: string
            example: import_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_id
              properties:
                item_id:
                  type: string
                  description: >-
                    The DigiTax ID of the existing item to link to the import
                    item.
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases:
    get:
      tags:
        - Purchases
      summary: Get list of purchases pulled from eTIMS.
      description: Retrieves a paginated list of purchases pulled from eTIMS.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                  - meta
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/FetchMeta'
                  data:
                    description: The list of purchases retrieved from eTIMS.
                    type: array
                    items:
                      $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}:
    get:
      tags:
        - Purchases
      summary: Get specific purchase
      description: Retrieves a purchase by its DigiTax ID.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          description: The DigiTax ID of the purchase to be retrieved.
          schema:
            type: string
            example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}/link-items:
    post:
      tags:
        - Purchases
      summary: Link purchase items to DigiTax items.
      description: >-
        Links purchase items to their corresponding DigiTax items using the
        supplied purchase item IDs and item IDs.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          description: The DigiTax ID of the purchase whose items are being linked.
          schema:
            type: string
            example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  description: >-
                    The purchase items to link to their corresponding DigiTax
                    items.
                  items:
                    type: object
                    required:
                      - purchase_item_id
                      - item_id
                    properties:
                      purchase_item_id:
                        type: string
                        description: The DigiTax ID of the purchase item to link.
                        example: purchaseitem_01HC3J1VVVM05YCTS61G7V3KC6
                      item_id:
                        type: string
                        description: >-
                          The DigiTax ID of the item to associate with the
                          purchase item.
                        example: item_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sales:
    post:
      tags:
        - Sales
      summary: Create a sale.
      description: >-
        Creates a sale using the supplied invoice details, customer information,
        and sale items.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trader_invoice_number
                - payment_type_code
                - invoice_status_code
                - items
                - sale_date
              properties:
                sale_date:
                  type: string
                  description: >-
                    The date of the sale (YYYY-MM-DD). Dates after the current
                    UTC date are rejected.
                  example: '2026-07-14'
                customer_tin:
                  type: string
                  example: P123456789Y
                  description: The KRA-approved tax identification number of the customer.
                customer_name:
                  type: string
                  example: John Doe
                  description: >-
                    The customer's name. If customer_name is provided without
                    customer_tin, the sale will not include customer details.
                customer_id:
                  type: string
                  example: customer_01HC3HTDAXQ50E07CWR2A2CFBD
                  description: >-
                    The DigiTax-generated customer ID. If both the customer_id
                    and customer_tin+customer_name are provided, the customer_id
                    is prioritised.
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                  description: >-
                    The invoice reference from your system. It must be unique
                    across sales and credit notes in the business. References
                    from failed transactions can be reused.
                payment_type_code:
                  type: string
                  description: The code identifying the payment method used for the sale.
                  example: '07'
                invoice_status_code:
                  type: string
                  description: >-
                    The invoice status code. Refer to the [Invoice Status Codes
                    table](https://ke.docs.digitax.tech/docs/invoice-attributes#invoice-status-codes)
                    for the code values.
                  example: '01'
                callback_url:
                  type: string
                  description: >-
                    Optional URL where DigiTax sends an HTTP POST callback with
                    event `sale.sync` when the sale's eTIMS synchronization
                    succeeds or fails. See [Callback
                    URLs](https://ke.docs.digitax.tech/docs/callback-urls) for
                    the payload. Must use HTTP(S), include a host, and contain
                    no credentials or fragment. Literal localhost and private IP
                    addresses are rejected; DNS hostnames are not resolved by
                    this check.
                  example: https://example.com/callback
                invoice_details:
                  type: string
                  example: Invoice Details
                  description: >-
                    Allows for additional details to be captured in the invoice.
                    This is not transmitted to KRA.
                is_tax_exempt:
                  type: boolean
                  description: Indicates whether the sale is tax-exempt.
                  example: false
                service_charge_rate:
                  type: number
                  format: double
                  description: >-
                    The rate used to calculate the service charge applied to the
                    sale.
                  example: 0.02
                items:
                  type: array
                  description: >-
                    The items included in the sale, with their DigiTax item IDs,
                    quantities, and amounts.
                  items:
                    type: object
                    required:
                      - id
                      - quantity
                      - unit_price
                      - total_amount
                    properties:
                      id:
                        type: string
                        example: item_01HC3J1VVVM05YCTS61G7V3KC6
                        description: >-
                          The DigiTax-generated item ID of a sale. This is
                          obtained after creating a sale using the [Add
                          Items](https://ke.docs.digitax.tech/reference/post_items)
                          endpoint.
                      quantity:
                        type: number
                        example: 1
                        description: The number of items being purchased by a customer.
                      unit_price:
                        type: number
                        example: 3500
                        description: >-
                          The unit price of each item being purchased inclusive
                          of applicable taxes.
                      total_amount:
                        type: number
                        example: 3500
                        description: >-
                          The product of the quantity and unit_price i.e.
                          quantity x unit_price. This is inclusive of any
                          applicable taxes.
                      package_unit_quantity:
                        type: number
                        description: The quantity of packages for the item.
                        example: 1
                      discount_rate:
                        type: number
                        example: 0
                        description: >-
                          The rate at which an item is discounted, calculated as
                          discount_amount / total_amount.
                      discount_amount:
                        type: number
                        example: 0
                        description: >-
                          The amount at which an item is discounted. This should
                          not exceed the total_amount.
                      item_description:
                        type: string
                        description: A description of the item being sold.
                        example: DigiTax Product 01
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Sales
      summary: Get sales
      description: >-
        Retrieves a paginated list of sales for the authenticated business. Date
        filters apply to the record creation date. An end_date can be used
        without a start_date to set only an upper date limit; results remain
        paginated.
      security:
        - apiKeyAuth: []
      parameters:
        - in: query
          name: start_date
          required: false
          schema:
            type: string
            description: >-
              Start date (YYYY-MM-DD) - sales returned will be inclusive of this
              date
            example: '2026-07-14'
        - in: query
          name: end_date
          required: false
          schema:
            type: string
            description: >-
              End date (YYYY-MM-DD) - sales returned will be inclusive of this
              date
            example: '2026-07-14'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    description: The list of sales matching the specified filters.
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sales-with-items:
    post:
      tags:
        - Sales
      summary: Add sale with item information
      description: Creates a sale using item details supplied directly in the request.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trader_invoice_number
                - payment_type_code
                - invoice_status_code
                - items
                - sale_date
              properties:
                sale_date:
                  type: string
                  description: >-
                    The date of the sale (YYYY-MM-DD). Dates after the current
                    UTC date are rejected.
                  example: '2026-07-14'
                customer_tin:
                  type: string
                  example: P123456789Y
                  description: The KRA-approved tax identification number of the customer.
                customer_name:
                  type: string
                  example: John Doe
                  description: >-
                    The customer's name. If only the customer_name is provided
                    and the customer_tin is omitted, a given sale will not have
                    any customer details
                customer_id:
                  type: string
                  example: customer_01HC3HTDAXQ50E07CWR2A2CFBD
                  description: >-
                    The DigiTax-generated customer ID. If both the customer_id
                    and customer_tin+customer_name are provided, the customer_id
                    is prioritised.
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                  description: >-
                    The invoice reference from your system. It must be unique
                    across sales and credit notes in the business. References
                    from failed transactions can be reused.
                receipt_type_code:
                  type: string
                  example: S
                  deprecated: true
                  description: >-
                    This field is deprecated and will be ignored if provided.
                    The receipt type code is populated automatically based on
                    invoice type
                payment_type_code:
                  type: string
                  description: The code identifying the payment method used for the sale.
                  example: '07'
                invoice_status_code:
                  type: string
                  description: >-
                    The invoice status code. Refer to the [Invoice Status Codes
                    table](https://ke.docs.digitax.tech/docs/invoice-attributes#invoice-status-codes)
                    for the code values.
                  example: '01'
                callback_url:
                  type: string
                  description: >-
                    Optional URL where DigiTax sends an HTTP POST callback with
                    event `sale.sync` when the sale's eTIMS synchronization
                    succeeds or fails. See [Callback
                    URLs](https://ke.docs.digitax.tech/docs/callback-urls) for
                    the payload.
                  example: https://example.com/callback
                invoice_auth:
                  type: object
                  deprecated: true
                  description: >-
                    This field has been replaced with dedicated endpoints for
                    reverse invoicing seen
                    [HERE](https://ke.docs.digitax.tech/reference/post_reverse-invoices).
                  required:
                    - type
                    - issuer
                  properties:
                    type:
                      type: string
                      description: The type of invoice authorization.
                      example: REVERSE
                    issuer:
                      type: string
                      description: >-
                        The DigiTax ID of the business issuing the reverse
                        invoice.
                      example: business_01HC3J1VVVM05YCTS61G7V3KC6
                invoice_details:
                  type: string
                  example: Invoice Details
                  description: >-
                    Allows for additional details to be captured in the invoice.
                    This is not transmitted to KRA.
                is_tax_exempt:
                  type: boolean
                  description: Indicates if the sale is tax-exempt.
                  example: false
                items:
                  type: array
                  description: >-
                    The items included in the sale, with their details supplied
                    directly in the request.
                  items:
                    type: object
                    required:
                      - id
                      - quantity
                      - unit_price
                      - total_amount
                      - item_name
                      - item_class_code
                      - item_bar_code
                      - item_tax_type_code
                    properties:
                      item_name:
                        type: string
                        example: Item name
                        description: The name of the item.
                      item_class_code:
                        type: string
                        example: '99000000'
                        description: >-
                          The item class code of the item. <br>Refer to the
                          [DigiTax Kenya eTIMS Item Classification Code
                          list](https://ke.docs.digitax.tech/docs/items-item-classification-table)
                          for more information.
                      item_bar_code:
                        type: string
                        example: '99000001'
                        description: >-
                          The unique user-provided identifier for the particular
                          item.
                      item_tax_type_code:
                        type: string
                        example: D
                        description: >-
                          The tax type code of the item. <br>Refer to the
                          [DigiTax Kenya eTIMS Tax Type Codes
                          list](https://ke.docs.digitax.tech/docs/item-attributes-items#taxation-type-codes)
                          for more information.
                      quantity:
                        type: number
                        example: 1
                        description: The number of items being purchased by a customer.
                      unit_price:
                        type: number
                        example: 3500
                        description: >-
                          The unit price of each item being purchased inclusive
                          of applicable taxes.
                      total_amount:
                        type: number
                        example: 3500
                        description: >-
                          The product of the quantity and unit_price i.e.
                          quantity x unit_price. This is inclusive of any
                          applicable taxes.
                      taxable_amount:
                        type: number
                        example: 3500
                        description: >-
                          The taxable amount of the item, calculated as
                          (total_amount - discount_amount)/(1 + tax_rate).
                      tax_amount:
                        type: number
                        example: 0
                        description: >-
                          The tax amount of the item, calculated as
                          (total_amount - discount_amount) - taxable_amount.
                      package_unit_quantity:
                        type: number
                        description: >-
                          The package unit quantity for the sale item. Defaults
                          to the item quantity when set to zero.
                        example: 1
                      discount_rate:
                        type: number
                        example: 0
                        description: >-
                          The rate at which an item is discounted, calculated as
                          discount_amount / total_amount.
                      discount_amount:
                        type: number
                        example: 0
                        description: >-
                          The amount at which an item is discounted. This should
                          not exceed the total_amount.
                      item_description:
                        type: string
                        description: A description of the item included in the sale.
                        example: DigiTax Product 01
                      is_stockable:
                        type: boolean
                        description: >-
                          Indicates if the item is stockable. <br>Stockable
                          items are treated as FINISHED goods, whereas
                          non-stockable items are treated as SERVICES.
                        example: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
