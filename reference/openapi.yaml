          type: string
          enum:
            - PENDING
            - FAILED
            - COMPLETED
          description: status against KRA
          example: completed
        sales_tax_summary:
          type: object
          description: Taxable amounts, tax rates, and tax amounts grouped by tax category.
          required:
            - taxable_amount_a
            - taxable_amount_b
            - taxable_amount_c
            - taxable_amount_d
            - taxable_amount_e
            - tax_rate_a
            - tax_rate_b
            - tax_rate_c
            - tax_rate_d
            - tax_rate_e
            - tax_amount_a
            - tax_amount_b
            - tax_amount_c
            - tax_amount_d
            - tax_amount_e
          properties:
            taxable_amount_a:
              type: number
              description: Total taxable amount for exempt items (tax type A).
              example: 0
            taxable_amount_b:
              type: number
              description: Total taxable amount for items subject to 16% VAT (tax type B).
              example: 517.24
            taxable_amount_c:
              type: number
              description: Total taxable amount for zero-rated items (tax type C).
              example: 0
            taxable_amount_d:
              type: number
              description: Total taxable amount for non-VAT items (tax type D).
              example: 0
            taxable_amount_e:
              type: number
              description: Total taxable amount for items subject to 8% VAT (tax type E).
              example: 0
            tax_rate_a:
              type: integer
              description: Tax rate percentage for exempt items (tax type A).
              example: 0
            tax_rate_b:
              type: integer
              description: Tax rate percentage for items subject to 16% VAT (tax type B).
              example: 16
            tax_rate_c:
              type: integer
              description: Tax rate percentage for zero-rated items (tax type C).
              example: 0
            tax_rate_d:
              type: integer
              description: Tax rate percentage for non-VAT items (tax type D).
              example: 0
            tax_rate_e:
              type: integer
              description: Tax rate percentage for items subject to 8% VAT (tax type E).
              example: 8
            catering_levy_rate:
              type: integer
              description: The catering levy rate applied to the sale.
              example: 2
            service_charge_rate:
              type: integer
              description: The service charge rate associated with the sale.
              example: 0
            tax_amount_a:
              type: number
              description: Total tax amount for exempt items (tax type A).
              example: 0
            tax_amount_b:
              type: number
              description: Total tax amount for items subject to 16% VAT (tax type B).
              example: 82.76
            tax_amount_c:
              type: number
              description: Total tax amount for zero-rated items (tax type C).
              example: 0
            tax_amount_d:
              type: number
              description: Total tax amount for non-VAT items (tax type D).
              example: 0
            tax_amount_e:
              type: number
              description: Total tax amount for items subject to 8% VAT (tax type E).
              example: 0
            catering_levy_amount:
              type: number
              description: The total catering levy amount for the sale.
              example: 0
            service_charge_amount:
              type: number
              description: The total service charge amount for the sale.
              example: 0
        item_list:
          type: array
          description: The list of items included in the sale.
          items:
            $ref: '#/components/schemas/SaleItem'
        kra_response_message:
          type: string
          description: >-
            The optional KRA-provided error message. This is only provided if a
            sale has failed.
