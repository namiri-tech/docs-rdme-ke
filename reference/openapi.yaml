      description: >-
        Creates a reverse credit note for an existing reverse invoice using item
        barcodes to identify the items being credited.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - return_date
                - sale_id
                - trader_invoice_number
              properties:
                return_date:
                  type: string
                  description: >-
                    The date of the return (YYYY-MM-DD). Future dates are
                    rejected.
                  example: '2026-07-14'
                sale_id:
                  type: string
                  description: The DigiTax ID of the original reverse invoice.
                  example: sale_01HC3J1VVVM05YCTS61G7V3KC6
                callback_url:
                  type: string
                  description: >-
                    Optional URL where DigiTax sends an HTTP POST callback with
                    event `sale.sync` when the reverse credit note's eTIMS
                    synchronization succeeds or fails. See [Callback
                    URLs](https://ke.docs.digitax.tech/docs/callback-urls) for
                    the payload. Must use HTTP or HTTPS, include a host, and
                    have no username or password. Localhost and private IP
                    addresses are not allowed.
                  example: https://example.com/callback
                invoice_details:
                  type: string
                  description: >-
                    Additional details for the invoice associated with the
                    credit note.
                  example: General Invoice Details
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                  description: >-
                    The invoice reference from your system. It must be unique
                    across sales and credit notes in the business. References
                    from failed transactions can be reused.
                items:
                  type: array
                  description: >-
                    The items being credited, identified by their item bar codes
                    and credit amounts.
                  items:
                    type: object
                    required:
                      - item_bar_code
                      - quantity
                      - unit_price
                      - total_amount
                    properties:
                      item_bar_code:
                        type: string
                        description: The barcode used to identify the item being credited.
                        example: HC3J1VVVM05YCTS61G7V3KC6
                      quantity:
                        type: number
                        description: The quantity of the item being credited.
                        example: 1
                      unit_price:
                        type: number
                        description: The unit price for one item being credited.
                        example: 3500
                      total_amount:
                        type: number
                        description: The total amount being credited.
                        example: 3500
                      taxable_amount:
                        type: number
                        description: The amount on which tax is calculated.
                        example: 3500
                      tax_amount:
                        type: number
                        description: The tax amount for the item.
                        example: 0
                      package_unit_quantity:
                        type: number
                        description: The package unit quantity for the credited item.
                        example: 1
                      discount_rate:
                        type: number
                        description: >-
                          The discount rate, calculated as discount amount
                          divided by total amount.
                        example: 0
                      discount_amount:
                        type: number
                        description: The discount amount for the item.
                        example: 0
                      item_description:
                        type: string
                        description: A description of the item being credited.
                        example: DigiTax Product 01
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
