            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reverse-invoices:
    post:
      tags:
        - Reverse Invoices
      summary: Add reverse invoice
      description: >-
        Creates an invoice on behalf of the supplier using the supplied invoice
        details and item references. The buyer creates regular reverse invoices;
        a third party creates third-party reverse invoices. The type depends on
        the supplier's reverse invoicing configuration. See [Reverse
        Invoicing](https://ke.docs.digitax.tech/docs/reverse-invoicing) for the
        process and supplier consent requirements.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - supplier_id
                - items
                - sale_date
                - trader_invoice_number
              properties:
                supplier_id:
                  type: string
                  description: The DigiTax ID of the supplier for the reverse invoice.
                  example: supplier_01JS16JDB2B5ESZ8HWJ3CBYP5Y
                sale_date:
                  type: string
                  description: >-
                    The date of sale (YYYY-MM-DD). Dates after the current UTC
                    date are rejected.
                  example: '2026-07-14'
                customer_tin:
                  type: string
                  description: The customer's tax identification number.
                  example: P123456789Y
                customer_name:
                  type: string
                  description: The name of the customer.
                  example: John Doe
                customer_phone:
                  type: string
                  description: The customer's phone number.
                  example: '+254714267891'
                customer_email:
                  type: string
                  description: The customer's email address.
                  example: john@doe.com
                payment_type_code:
                  type: string
                  description: The code identifying the payment type.
                  example: '07'
                invoice_details:
                  type: string
                  description: Additional details associated with the invoice.
                  example: Invoice Details
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                  description: >-
                    The invoice reference from your system. It must be unique
                    across sales and credit notes in the business. References
                    from failed transactions can be reused.
                callback_url:
                  type: string
                  description: >-
                    Optional URL where DigiTax sends an HTTP POST callback with
                    event `sale.sync` when the reverse invoice's eTIMS
                    synchronization succeeds or fails. See [Callback
                    URLs](https://ke.docs.digitax.tech/docs/callback-urls) for
                    the payload. Must use HTTP(S), include a host, and contain
                    no credentials. Literal localhost and private IP addresses
                    are rejected.
                  example: https://example.com/callback
                items:
                  type: array
                  description: The list of items included in the reverse invoice.
                  items:
                    type: object
                    required:
                      - id
                      - quantity
                      - unit_price
                      - discount_rate
                      - discount_amount
                      - total_amount
                    properties:
                      id:
                        type: string
                        example: item_01HC3J1VVVM05YCTS61G7V3KC6
                        description: The DigiTax ID of the item being invoiced.
                      quantity:
                        type: number
                        example: 1
                        description: The quantity of the item being invoiced.
                      unit_price:
                        type: number
                        example: 3500
                        description: >-
                          The unit price provided for the item, in KES major
                          units (not cents).
                      total_amount:
                        type: number
                        example: 3500
                        description: >-
                          The line amount before discount, in Kenyan shillings
                          (KES).
                      package_unit_quantity:
                        type: number
                        example: 1
                        description: >-
                          The package quantity for the item. When zero, the
                          service uses the item quantity.
                      discount_rate:
                        type: number
                        example: 0
                        description: The discount rate for the item.
                      discount_amount:
                        type: number
                        example: 0
                        description: The discount amount for the item.
                      item_description:
                        type: string
                        example: DigiTax Product 01
                        description: >-
                          A description of the item included in the reverse
                          invoice.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Reverse Invoices
      summary: Get reverse invoices
      description: Retrieves a paginated list of reverse invoices.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    description: The list of reverse invoices.
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reverse-invoices/{sale_id}:
